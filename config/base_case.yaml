# Base-case parameters.
# Every parameter has: value, unit, source.
# Values are written in the units of the source. The FIRST WORD of `unit` must be a
# unit listed in src/layout_rel/units.py (e.g. h, days, yr, 1/h, 1/yr, 1/(km*yr),
# USD/day, bbl/day, USD/bbl); config.param() converts it to SI (m, s, Sm3, USD).
#
# Cost sources: see docs/sources.md.
#   Lines: Kaiser (2016), installed, 2014 USD.
#   Trees, manifolds, vessels: Bai & Bai (2010) Ch. 6, 2009 USD. Not yet escalated
#   to a common year; overheads/contingency (Bai Fig. 6-18) not yet applied.
# Run `python -m layout_rel.config` to list any parameter still marked PLACEHOLDER.

field_file:
  value: field_toy.yaml
  unit: "-"
  source: "Made-up 6-well field for model development (work plan step 2)"

manifold:
  sizes:
    value: [2, 4, 6, 8]
    unit: slots (wells per manifold); each open site gets one of these sizes
    source: "Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, p. 176: 'Manifolds are usually designed with 2, 4, 6, 8, and sometimes 10 slots.' 10-slot left out (rare)."
  slot_cost_factor:
    value: {2: 0.70, 4: 1.00, 6: 1.30, 8: 1.50, 10: 2.00}
    unit: "- (multiplies manifold base cost; 4 slots = 1)"
    source: "Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, p. 176, Cost Factor: Number of Slots (cluster manifold), average values."

vessels:
  modu_deep_day_rate:
    value: 950.0e+3
    unit: USD/day
    source: "Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, Table 6-3, MODU > 1500 m (5000 ft), average day rate (min 750k, max 1050k)."
  msv_day_rate:
    value: 80.0e+3
    unit: USD/day
    source: "Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, Table 6-3, MSV (multi-service vessel), average day rate (min 40k, max 120k)."
  msv_mobilisation:
    value: 14.0
    unit: days (call-out to arrival on site, incl. vessel availability)
    source: "PLACEHOLDER - no source yet; Bai & Bai Fig. 6-17 defines this as T_RA but gives no value. Key parameter for novelty angle 2; needs a North Sea value."
  hlv_mobilisation:
    value: 30.0
    unit: days (call-out to arrival on site, incl. vessel availability)
    source: "PLACEHOLDER - no source yet; heavy vessels assumed slower to secure than light vessels."
  hlv_day_rate:
    value: 400.0e+3
    unit: USD/day
    source: "Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, Table 6-3, HLV (heavy-lift vessel), average day rate (min 250k, max 550k)."

capex:
  xmas_tree:
    procurement:
      value: 2.95e+6
      unit: USD per tree (2009 USD)
      source: "Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, p. 174, Eq. 6-6: C = fs*ft*fp*C0 + Cmisc with C0 = 2.75 MUSD average (5-in, 10 ksi, VXT, carbon steel; min 2.50, max 3.00), fs = ft = fp = 1, Cmisc = 0.20 MUSD average (insulation). Includes pipeline connector, tree cap, ROV choke; excludes tubing hanger, SCM, junction plate, sensors."
    sit:
      value: 0.20e+6
      unit: USD per tree
      source: "Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, Table 6-2, SIT cost, tree and tubing hanger, average (min 0.10, max 0.30 MUSD)."
    install_days:
      value: 3.0
      unit: days per tree
      source: "Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, p. 182: 'Tree installation ... normally takes 2 to 4 days'; Table 6-6 uses 3 days."
    install_vessel:
      value: modu_deep
      unit: key in `vessels` (<name>_day_rate)
      source: "Assumption: trees run from a drilling rig (MODU), as in Bai & Bai Table 6-6 (1000k USD/day)."
  manifold:
    procurement_base:
      value: 3.0e+6
      unit: USD per 4-slot manifold (2009 USD), scaled by manifold.slot_cost_factor
      source: "Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, p. 176, Eq. 6-7: C = fs*fn*ft*C0 + Cmisc with C0 = 3.0 MUSD average (4-slot cluster, 10-in header, 10 ksi, carbon steel; min 2.0, max 4.0), fs = ft = 1."
    procurement_misc:
      value: 0.25e+6
      unit: USD per manifold (2009 USD)
      source: "Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, p. 177, Cmisc (e.g. insulation), average (min 0.15, max 0.35 MUSD)."
    sit:
      value: 0.20e+6
      unit: USD per manifold
      source: "Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, Table 6-2, SIT cost, manifold, average (min 0.15, max 0.25 MUSD)."
    foundation:
      value: 1.0e+6
      unit: USD per manifold (2007 USD)
      source: "Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, Table 6-6 (2007 data), suction pile for manifold: 1,000,000 USD."
    install_days:
      value: 2.0
      unit: days per manifold
      source: "Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, Table 6-4, manifold installation 1-3 days (1500 m water depth); midpoint."
    install_vessel:
      value: hlv
      unit: key in `vessels` (<name>_day_rate)
      source: "Assumption: manifold lifted by a heavy-lift vessel (Bai & Bai Table 6-3 vessel types)."
  infield_flowline:
    value: 2243.0
    unit: USD/m (well -> manifold flowline/jumper, installed, 2014 USD)
    source: "Kaiser, M.J. (2016). A review of deepwater pipeline construction in the U.S. Gulf of Mexico - contracts, cost, and installation methods. J. Marine Sci. Appl. 15(3):288-306, doi:10.1007/s11804-016-1373-7. Table 2, infield, All: 3.61 MMUSD/mi (2014 USD, sd 3.19), = 3.61e6/1609.344 USD/m. Kaiser normalises (flowline+umbilical cost) by (flowline+umbilical mileage), so the same rate applies per m of each line. GoM data; no split by line type or diameter."
  infield_umbilical:
    value: 2243.0
    unit: USD/m (manifold -> well umbilical jumper, installed, 2014 USD)
    source: "Kaiser, M.J. (2016). A review of deepwater pipeline construction in the U.S. Gulf of Mexico - contracts, cost, and installation methods. J. Marine Sci. Appl. 15(3):288-306, doi:10.1007/s11804-016-1373-7. Table 2, infield, All: 3.61 MMUSD/mi (2014 USD, sd 3.19), = 3.61e6/1609.344 USD/m. Kaiser normalises (flowline+umbilical cost) by (flowline+umbilical mileage), so the same rate applies per m of each line. GoM data; no split by line type or diameter."
  tieback_flowline:
    value: 2243.0
    unit: USD/m (manifold -> host production flowline, installed, 2014 USD)
    source: "Kaiser, M.J. (2016). A review of deepwater pipeline construction in the U.S. Gulf of Mexico - contracts, cost, and installation methods. J. Marine Sci. Appl. 15(3):288-306, doi:10.1007/s11804-016-1373-7. Table 2, infield, All: 3.61 MMUSD/mi (2014 USD, sd 3.19), = 3.61e6/1609.344 USD/m. Kaiser normalises (flowline+umbilical cost) by (flowline+umbilical mileage), so the same rate applies per m of each line. GoM data; no split by line type or diameter."
  tieback_umbilical:
    value: 2243.0
    unit: USD/m (host -> manifold main umbilical, installed, 2014 USD)
    source: "Kaiser, M.J. (2016). A review of deepwater pipeline construction in the U.S. Gulf of Mexico - contracts, cost, and installation methods. J. Marine Sci. Appl. 15(3):288-306, doi:10.1007/s11804-016-1373-7. Table 2, infield, All: 3.61 MMUSD/mi (2014 USD, sd 3.19), = 3.61e6/1609.344 USD/m. Kaiser normalises (flowline+umbilical cost) by (flowline+umbilical mileage), so the same rate applies per m of each line. GoM data; no split by line type or diameter."

production:
  well_rate:
    value: 6000.0
    unit: bbl/day per well (plateau, all wells equal)
    source: "Silva & Guedes Soares (2025), Ocean Eng. 324, 120668, Table 8: estimated well production plateau 6000 bbl/d. Plateau only; a decline profile comes with the NPV model (step 6)."
  oil_price:
    value: 70.0
    unit: USD/bbl
    source: "Own assumption (CLAUDE.md), same as Silva & Guedes Soares (2025) Table 8 (70 USD/bbl). Tested in sensitivity."

# Failure rates (constant, exponential model). See docs/sources.md "Failure-rate summary".
# `affects` is decided by the layout: tree and infield line -> 1 well; manifold, tie-back
# flowline and tie-back umbilical -> every well on that manifold.
reliability:
  xmas_tree:
    failure_rate_per_h:
      value: 8.49e-6
      unit: 1/h per tree
      source: "Sum of (a) Bai & Bai (2010) Table 11-14 mean column, 8 tree components, OREDA 2002: 0.246e-6/h, and (b) Mahmoudi et al. (2021) Qual. Reliab. Eng. Int. 37:3297, Table 7, lambda_crit of one of each SCM component (SEM 5.155, solenoid valve 0.3169, power/signal coupler 0.1203, hydraulic coupling 0.0349, PSU 0.8881, check valve 0.2146, valve other 1.5089) = 8.24e-6/h. Lower bound: real SCMs have many solenoid valves."
  manifold:
    failure_rate_per_h:
      value: 23.82e-6
      unit: 1/h per manifold (same for all slot sizes)
      source: "Silva & Guedes Soares (2025), Ocean Eng. 324, 120668, Sec. 4.3: OREDA (2022) manifold failure rate 23.82 per 10^6 h. All failure modes. Cross-check: Liu et al. (2024) Sci. Rep. 14:22873, Table 6 sum = 41.4e-6/h (OREDA 2015). Applies to a manifold of `reference_slots`; scaled with slot count by `slot_fraction`."
    reference_slots:
      value: 4
      unit: slots
      source: "Assumption: the OREDA average manifold is taken as a 4-slot cluster manifold (the base unit in Bai & Bai 2010 p. 176 and in Silva & Guedes Soares 2025 Sec. 4.3)."
    slot_fraction:
      value: 0.493
      unit: fraction of the reference rate that scales with slot count
      source: "Liu et al. (2024) Sci. Rep. 14:22873, Table 6 means (Table 5 codes). Our classification: per-slot branch items X1, X2, X3 (couplers/connector), X8-X12, X18, X19 (valves) = 20.42 of 41.44 per 10^6 h. Fixed: insulation, header pipe, structures, pigging module, base. Rate(k) = rate_ref * ((1 - f) + f * k / reference_slots)."
  infield_flowline:
    failure_rate_per_km:
      value: 2.4e-4
      unit: 1/(km*yr)
      source: "DNV GL (2017) Recommended failure rates for pipelines, rigid small-diameter subsea pipelines, as quoted in Silva & Guedes Soares (2025) Table 2."
  tieback_flowline:
    failure_rate_per_km:
      value: 2.4e-4
      unit: 1/(km*yr)
      source: "As infield_flowline (DNV GL 2017 via Silva & Guedes Soares 2025, Table 2)."
  tieback_umbilical:
    failure_rate_per_unit:
      value: 4.2669e-6
      unit: 1/h per umbilical
      source: "Thies, Smith & Johanning (2012) Renew. Energy 44:359, Sec. 5.2.1: OREDA (2002) p. 811 umbilical, mean 4.2669 per 10^6 h (sd 4.8281), 9 units / 2 failures."
  infield_umbilical:
    failure_rate_per_unit:
      value: 0.0
      unit: 1/h per well jumper
      source: "Assumption: infield umbilical jumpers / flying leads not modelled separately (no data); their controls side is partly in the SCM rate. Set > 0 to include."

# Repair of each failure: vessel, active repair time, spare-part cost.
# Downtime = mobilisation + weather_wait_days + repair_days * (1 + weather_allowance).
# Repair cost = day rate * downtime + spare (vessel on hire while mobilising and waiting).
maintenance:
  weather_allowance:
    value: 0.25
    unit: fraction of active repair time
    source: "Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, Fig. 6-18 step 4: 'Add another 20-30% for duration considering unknown weather downtime' (installation); midpoint, applied to repairs."
  xmas_tree:
    vessel:
      value: msv
      unit: key in `vessels`
      source: "Assumption: tree failures are dominated by the SCM (0.072 of 0.074 per yr), which is changed by an ROV from a light vessel (cf. Østebø et al. 2001, OTC 13290: flow control module replaced 'from a monohull vessel in less than 48 hours')."
    repair_days:
      value: 2.0
      unit: days
      source: "Østebø, Kallestad & Grytdal (2001) OTC 13290: module replaced in less than 48 h; Bai & Bai (2010) p. 317 assumes a 2-day delay for a tree failure."
    weather_wait_days:
      value: 0.0
      unit: days (expected wait for a weather window, added to downtime)
      source: "Base case: 0, weather handled by weather_allowance (Bai & Bai 2010 Fig. 6-18). The North Sea case sets it from the NORA3 hindcast (scripts/weather_windows.py)."
    weather_critical_lifts:
      value: 1
      unit: "- (lifts through the splash zone that need a DNV weather window)"
      source: "Assumption: one weather-critical lift (SCM/module retrieval and reinstallation in one splash-zone sequence); ROV work tolerates higher sea states."
    spare_cost:
      value: 1.703e+6
      unit: USD per failure (2007 USD)
      source: "Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, Table 6-6 (2007 data): tree-mounted controls, 3 units = 5,108,940 USD -> 1.703 MUSD per SCM. Assumes every tree failure needs a new SCM (conservative)."
  manifold:
    vessel:
      value: hlv
      unit: key in `vessels`
      source: "Assumption: manifold repair (module/valve insert change or retrieval) by a heavy-lift / construction vessel, as for installation."
    repair_days:
      value: 4.0
      unit: days
      source: "Assumption: retrieve + reinstall, each 2 days (Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, Table 6-4, manifold installation 1-3 days)."
    weather_wait_days:
      value: 0.0
      unit: days (expected wait for a weather window, added to downtime)
      source: "Base case: 0, weather handled by weather_allowance (Bai & Bai 2010 Fig. 6-18). The North Sea case sets it from the NORA3 hindcast (scripts/weather_windows.py)."
    weather_critical_lifts:
      value: 2
      unit: "- (lifts through the splash zone that need a DNV weather window)"
      source: "Assumption: two weather-critical lifts (recover module/insert, deploy replacement)."
    spare_cost:
      value: 1.104e+6
      unit: USD per failure (2007 USD)
      source: "Proxy: Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, Table 6-6 (2007 data), 'Manifold Equipments' 1,104,163 USD. Assumes one manifold module/valve set per failure."
  flowline:
    vessel:
      value: hlv
      unit: key in `vessels`
      source: "Assumption: flowline repair by a construction vessel; HLV day rate used (Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, Table 6-3)."
    repair_days:
      value: 6.0
      unit: days
      source: "Assumption: midpoint of Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing, Table 6-4 'Flowline (10 km)' installation 4-8 days."
    weather_wait_days:
      value: 0.0
      unit: days (expected wait for a weather window, added to downtime)
      source: "Base case: 0, weather handled by weather_allowance (Bai & Bai 2010 Fig. 6-18). The North Sea case sets it from the NORA3 hindcast (scripts/weather_windows.py)."
    weather_critical_lifts:
      value: 2
      unit: "- (lifts through the splash zone that need a DNV weather window)"
      source: "Assumption: two weather-critical lifts (recover damaged section, deploy repair spool/clamp)."
    spare_cost:
      value: 0.59e+6
      unit: USD per failure (2009 USD)
      source: "Assumption: replace 1 km of 10-in rigid pipe at Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing p. 179 base cost 230 USD/m + coating 360 USD/m."
  umbilical:
    vessel:
      value: hlv
      unit: key in `vessels`
      source: "Assumption: umbilical section replacement by a construction vessel; HLV day rate used."
    repair_days:
      value: 6.0
      unit: days
      source: "Zhang et al. (2025) Expert Syst. Appl. 274:127034, Sec. 3.3: replacement of subsea communication cables 'took only 6 days' (South China Sea)."
    weather_wait_days:
      value: 0.0
      unit: days (expected wait for a weather window, added to downtime)
      source: "Base case: 0, weather handled by weather_allowance (Bai & Bai 2010 Fig. 6-18). The North Sea case sets it from the NORA3 hindcast (scripts/weather_windows.py)."
    weather_critical_lifts:
      value: 2
      unit: "- (lifts through the splash zone that need a DNV weather window)"
      source: "Assumption: two weather-critical lifts (recover damaged section, deploy replacement section)."
    spare_cost:
      value: 1.52e+6
      unit: USD per failure (2007 USD)
      source: "Assumption: replace 1 km of umbilical at Bai, Y. & Bai, Q. (2010). Subsea Engineering Handbook. Gulf Professional Publishing Table 6-6 procurement rate (11,606,659 USD / 25,000 ft = 1523 USD/m)."

# Field-life economics (NPV). CAPEX at t = 0, production years t = 1..field_life.
economics:
  field_life:
    value: 20.0
    unit: yr
    source: "Own assumption (CLAUDE.md). Bai & Bai (2010) p. 183: well production life 'about 5 to 20 years'; Østebø et al. (2001): Åsgard minimum life 20 years."
  discount_rate:
    value: 0.10
    unit: fraction per year
    source: "Own assumption (CLAUDE.md); same as Sales, Stanko & Jäschke (2023) Table C.1 (r = 10 %)."
  plateau_years:
    value: 3.0
    unit: yr
    source: "Own assumption (CLAUDE.md): plateau length before decline. Tested in sensitivity."
  decline_rate:
    value: 0.12
    unit: fraction per year (exponential, after plateau)
    source: "Own assumption (CLAUDE.md). Tested in sensitivity."
  opex_fraction_of_capex:
    value: 0.03
    unit: fraction of CAPEX per year (planned OPEX excl. failures)
    source: "PLACEHOLDER - no source yet; failure-related OPEX is modelled separately (maintenance)."

# Monte Carlo check of the expected-value model, and risk (CVaR) settings. Step 7.
montecarlo:
  n_sims:
    value: 20000
    unit: "- (simulated field lives per layout)"
    source: "Choice: gives a standard error of the mean well below 1 % of the mean."
  seed:
    value: 12345
    unit: "-"
    source: "Fixed seed for reproducibility (CLAUDE.md conventions)."

risk:
  alpha:
    value: 0.95
    unit: "- (CVaR confidence level: mean of the worst 5 % of outcomes)"
    source: "Common choice in risk-averse optimisation (Rockafellar & Uryasev 2000, J. Risk 2:21-42, doi:10.21314/JOR.2000.038)."
  weight:
    value: 0.0
    unit: "- (0 = expected value only, 1 = CVaR only)"
    source: "Decision-maker preference; 0 in the base case, varied in step 7 and 8."
  n_scenarios:
    value: 1000
    unit: "- (sampled failure scenarios inside the MILP)"
    source: "Choice: trade-off between MILP size and accuracy of the CVaR estimate; checked out-of-sample."
  seed:
    value: 2024
    unit: "-"
    source: "Fixed seed for the in-MILP scenarios (different from montecarlo.seed, so the out-of-sample check is independent)."

# Sensitivity ranges (step 8). Each item changes the listed `targets` (dotted keys of
# raw YAML values) to `low` / `high`: mode "scale" multiplies the base value, mode "set"
# replaces it (one number for all targets, or one per target).
sensitivity:
  oil_price:
    value: {targets: [production.oil_price], mode: set, low: 50.0, high: 100.0}
    unit: USD/bbl
    source: "Own assumption range (CLAUDE.md)."
  well_rate:
    value: {targets: [production.well_rate], mode: scale, low: 0.5, high: 1.5}
    unit: "- (x base 6000 bbl/day)"
    source: "Own assumption range (+/- 50 %)."
  vessel_day_rates:
    value: {targets: [vessels.msv_day_rate, vessels.hlv_day_rate, vessels.modu_deep_day_rate], mode: set, low: [40.0e+3, 250.0e+3, 750.0e+3], high: [120.0e+3, 550.0e+3, 1050.0e+3]}
    unit: USD/day
    source: "Bai & Bai (2010) Table 6-3 minimum and maximum day rates (MSV, HLV, MODU > 1500 m)."
  mobilisation_time:
    value: {targets: [vessels.msv_mobilisation, vessels.hlv_mobilisation], mode: scale, low: 0.5, high: 2.0}
    unit: "- (x base)"
    source: "Assumed range; base values not yet sourced (CLAUDE.md novelty angle 2)."
  weather_wait:
    value: {targets: [maintenance.xmas_tree.weather_wait_days, maintenance.manifold.weather_wait_days, maintenance.flowline.weather_wait_days, maintenance.umbilical.weather_wait_days], mode: scale, low: 0.5, high: 2.0}
    unit: "- (x base; 0 in the toy case, NORA3/DNV values in the North Sea case)"
    source: "Assumed range around the hindcast-based waits (vessel Hs limits and lift duration are not yet sourced); seasonal extremes are run as separate cases (solveig_weather_winter/summer)."
  repair_time:
    value: {targets: [maintenance.xmas_tree.repair_days, maintenance.manifold.repair_days, maintenance.flowline.repair_days, maintenance.umbilical.repair_days], mode: scale, low: 0.5, high: 2.0}
    unit: "- (x base)"
    source: "Assumed range (repair durations are partly assumptions, see config)."
  weather_allowance:
    value: {targets: [maintenance.weather_allowance], mode: set, low: 0.20, high: 0.30}
    unit: fraction
    source: "Bai & Bai (2010) Fig. 6-18: 20-30 %."
  all_failure_rates:
    value: {targets: [reliability.xmas_tree.failure_rate_per_h, reliability.manifold.failure_rate_per_h, reliability.infield_flowline.failure_rate_per_km, reliability.tieback_flowline.failure_rate_per_km, reliability.tieback_umbilical.failure_rate_per_unit], mode: scale, low: 0.5, high: 2.0}
    unit: "- (x base)"
    source: "CLAUDE.md: failure rates x0.5 and x2."
  manifold_failure_rate:
    value: {targets: [reliability.manifold.failure_rate_per_h], mode: set, low: 11.85e-6, high: 67.34e-6}
    unit: 1/h
    source: "Liu et al. (2024) Sci. Rep. 14:22873, Eq. 32 fuzzy interval [0.1185e-4, 0.6734e-4] per hour."
  tree_failure_rate:
    value: {targets: [reliability.xmas_tree.failure_rate_per_h], mode: set, low: 4.25e-6, high: 16.3e-6}
    unit: 1/h
    source: "Low: base x0.5 (CLAUDE.md). High (our estimate): SCM with 20 solenoid control valves (Mahmoudi et al. 2021 Table 7, 14.3e-6/h) + Bai & Bai Table 11-14 upper column (2.05e-6/h)."
  umbilical_failure_rate:
    value: {targets: [reliability.tieback_umbilical.failure_rate_per_unit], mode: set, low: 0.2e-6, high: 14.0e-6}
    unit: 1/h
    source: "Thies et al. (2012) Fig. 6: 90 % interval 0.2-14 per 10^6 h (OREDA 2002)."
  slot_fraction:
    value: {targets: [reliability.manifold.slot_fraction], mode: set, low: 0.0, high: 1.0}
    unit: fraction
    source: "Model bounds: 0 = rate independent of slots (Silva & Guedes Soares 2025), 1 = rate proportional to slots."
  line_capex:
    value: {targets: [capex.infield_flowline, capex.infield_umbilical, capex.tieback_flowline, capex.tieback_umbilical], mode: set, low: 621.0, high: 3728.0}
    unit: USD/m
    source: "Kaiser (2016) Sec. 5: 'the majority of costs ranged from 1 to 6 million USD/mi' -> 621-3728 USD/m."
  manifold_capex:
    value: {targets: [capex.manifold.procurement_base], mode: set, low: 2.0e+6, high: 4.0e+6}
    unit: USD
    source: "Bai & Bai (2010) p. 176: manifold base cost C0 min 2.0, max 4.0 MUSD."
  tree_capex:
    value: {targets: [capex.xmas_tree.procurement], mode: set, low: 2.6e+6, high: 3.3e+6}
    unit: USD
    source: "Bai & Bai (2010) p. 174: C0 min/max 2.50/3.00 MUSD + Cmisc min/max 0.10/0.30 MUSD."
  opex_fraction:
    value: {targets: [economics.opex_fraction_of_capex], mode: set, low: 0.0, high: 0.06}
    unit: fraction
    source: "Assumed range around the unsourced base value 0.03."
  discount_rate:
    value: {targets: [economics.discount_rate], mode: set, low: 0.08, high: 0.12}
    unit: fraction
    source: "Own assumption range (CLAUDE.md)."
  field_life:
    value: {targets: [economics.field_life], mode: set, low: 15.0, high: 25.0}
    unit: yr
